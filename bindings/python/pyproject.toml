[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "smoothapi-rs"
version = "0.1.0"
description = "Native Rust bindings for SmoothAPI Python"
requires-python = ">=3.10"
license = { text = "MIT" }
readme = "README.md"
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
]

[tool.maturin]
module-name = "smoothapi_rs"
binding = "pyo3"
features = ["pyo3/extension-module", "pyo3/abi3-py310"]
