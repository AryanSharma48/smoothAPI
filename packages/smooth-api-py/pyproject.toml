[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "smoothapi-py"
version = "1.3.2"
description = "API protection library — exponential backoff and circuit breaker"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["robustness", "circuit-breaker", "retry", "backoff", "http"]
dependencies = []

[project.urls]
Homepage = "https://smoothapi.org"
Issues = "https://github.com/AryanSharma48/smoothAPI/issues"
Repository = "https://github.com/AryanSharma48/smoothAPI.git"

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
  "pytest-asyncio>=0.21",
  "requests>=2.28",
  "httpx>=0.24",
]

[tool.hatch.build.targets.wheel]
packages = ["smooth_api"]
