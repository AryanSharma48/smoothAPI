name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  changes:
    name: Detect Changed Paths
    runs-on: ubuntu-latest
    outputs:
      typescript: ${{ steps.filter.outputs.typescript }}
      python: ${{ steps.filter.outputs.python }}
      rust: ${{ steps.filter.outputs.rust }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            typescript:
              - 'packages/smooth-api-ts/**'
              - '!packages/smooth-api-ts/**/*.md'
              - 'sandbox/**'
              - '.github/workflows/ci.yml'
            python:
              - 'packages/smooth-api-py/**'
              - '!packages/smooth-api-py/**/*.md'
              - 'sandbox/**'
              - '.github/workflows/ci.yml'
            rust:
              - 'core/rust/**'
              - '!core/rust/**/*.md'
              - 'bindings/**'
              - '!bindings/**/*.md'
              - 'benchmarks/rust/**'
              - '.github/workflows/ci.yml'

  typescript-checks:
    name: TypeScript Checks (Types & Security Audit)
    needs: changes
    if: ${{ needs.changes.outputs.typescript == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: 'packages/smooth-api-ts/package.json'

      - name: Install TypeScript package dependencies
        working-directory: ./packages/smooth-api-ts
        run: npm install

      - name: Type Check (tsc --noEmit)
        working-directory: ./packages/smooth-api-ts
        run: npx tsc --noEmit

      - name: Security Audit (npm audit)
        working-directory: ./packages/smooth-api-ts
        run: npm audit --audit-level=high

  python-checks:
    name: Python Checks (Lint & Types)
    needs: changes
    if: ${{ needs.changes.outputs.python == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'
          cache-dependency-path: 'packages/smooth-api-py/pyproject.toml'

      - name: Install Python tools
        working-directory: ./packages/smooth-api-py
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy -e ".[dev]"

      - name: Python Lint (Ruff)
        working-directory: ./packages/smooth-api-py
        run: ruff check .

      - name: Python Type Check (Mypy)
        working-directory: ./packages/smooth-api-py
        run: mypy smooth_api --ignore-missing-imports

  typescript-tests:
    needs: changes
    if: ${{ needs.changes.outputs.typescript == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: |
            sandbox/package.json
            packages/smooth-api-ts/package.json
          
      - name: Install sandbox dependencies
        working-directory: ./sandbox
        run: npm install
        
      - name: Start sandbox server
        working-directory: ./sandbox
        run: node server.js &
        
      - name: Wait for sandbox server
        run: |
          # Wait up to 10 seconds for the server to be ready
          for i in {1..10}; do
            curl -s -f http://localhost:3001/health > /dev/null && break || sleep 1
          done
          
      - name: Install TypeScript package dependencies
        working-directory: ./packages/smooth-api-ts
        run: npm install
        
      - name: Build and Test TypeScript package
        working-directory: ./packages/smooth-api-ts
        run: |
          npm run build
          npm test

  python-tests:
    needs: changes
    if: ${{ needs.changes.outputs.python == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js (for sandbox server)
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: 'sandbox/package.json'
          
      - name: Install sandbox dependencies
        working-directory: ./sandbox
        run: npm install
        
      - name: Start sandbox server
        working-directory: ./sandbox
        run: node server.js &
        
      - name: Wait for sandbox server
        run: |
          for i in {1..10}; do
            curl -s -f http://localhost:3001/health > /dev/null && break || sleep 1
          done
          
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: 'packages/smooth-api-py/pyproject.toml'
          
      - name: Install Python package dependencies
        working-directory: ./packages/smooth-api-py
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          
      - name: Run Python tests
        working-directory: ./packages/smooth-api-py
        run: pytest tests/ -v

  rust-checks:
    name: Rust Checks (Format & Clippy)
    needs: changes
    if: ${{ needs.changes.outputs.rust == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust Format Check
        run: |
          cargo fmt --manifest-path core/rust/Cargo.toml -- --check
          cargo fmt --manifest-path bindings/node/Cargo.toml -- --check

      - name: Rust Clippy
        run: |
          cargo clippy --manifest-path core/rust/Cargo.toml -- -D warnings
          cargo clippy --manifest-path bindings/node/Cargo.toml -- -D warnings

  rust-tests:
    name: Rust Core Unit Tests
    needs: changes
    if: ${{ needs.changes.outputs.rust == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Run Core Rust tests
        run: cargo test --manifest-path core/rust/Cargo.toml --verbose

  node-native-tests:
    name: Node-API Native Addon Build & Tests
    needs: changes
    if: ${{ needs.changes.outputs.rust == 'true' || needs.changes.outputs.typescript == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'bindings/node/package.json'

      - name: Install dependencies
        working-directory: ./bindings/node
        run: npm install

      - name: Build Native Addon
        working-directory: ./bindings/node
        run: npm run build

      - name: Test Native Addon Binding
        working-directory: ./bindings/node
        run: |
          node -e "const { calculateBackoffNative, evaluateResponseNative, NativeCircuitBreaker } = require('./index.js'); if (calculateBackoffNative(2, 100, 30000) !== 400) throw new Error('Native backoff calculation failed'); const decision = evaluateResponseNative(429, 0, 100, 30000, 3, null); if (decision.type !== 'Retry') throw new Error('Native evaluateResponse failed'); const cb = new NativeCircuitBreaker(3, 5000); if (cb.state !== 'CLOSED') throw new Error('Native CB failed'); console.log('All Native Addon checks passed successfully.');"


