name: bugbot-fix
run-name: Fix issue #${{ inputs.issue_number }}

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Issue number to autonomously fix'
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: bugbot-fix-${{ inputs.issue_number }}
  cancel-in-progress: false

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      ISSUE: ${{ inputs.issue_number }}
      N8N_URL: ${{ secrets.N8N_CALLBACK_URL }}
      N8N_SECRET: ${{ secrets.N8N_SHARED_SECRET }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Read issue details
        run: |
          gh issue view "$ISSUE" --json title,body > issue.json
          jq -r '"Fix this bug in smoothapi. Make the smallest possible change (under 25 lines) that fixes the problem or passes tests. Output ONLY search/replace diff blocks. Do NOT rewrite or reprint the entire file.\n\nTitle: \(.title)\n\n\(.body | .[0:1500])"' issue.json > task.txt
          echo "Task description prepared for coding agent."

      - name: Create fix branch
        run: |
          git config user.name "bugbot[bot]"
          git config user.email "bugbot@users.noreply.github.com"
          git checkout -B "fix/issue-$ISSUE"

      - name: Install dependencies, sandbox server & Aider
        run: |
          python -m pip install --upgrade pip
          python -m pip install aider-chat pytest pytest-asyncio requests httpx
          if [ -f "packages/smooth-api-py/pyproject.toml" ]; then
            python -m pip install -e "packages/smooth-api-py[dev]"
          fi
          if [ -f "packages/smooth-api-ts/package.json" ]; then
            npm install --prefix packages/smooth-api-ts
          fi

          # Start mock sandbox server on port 3001 required by both test suites
          if [ -f "sandbox/package.json" ]; then
            npm install --prefix sandbox
            node sandbox/server.js &
            for i in {1..10}; do
              curl -s -f http://localhost:3001/health > /dev/null && echo "Mock sandbox server ready" && break || sleep 1
            done
          fi

          # Create monorepo test runner for Aider
          cat << 'EOF' > run_tests.sh
          #!/bin/bash
          set -e
          if [ -f "packages/smooth-api-ts/package.json" ]; then
            npm test --prefix packages/smooth-api-ts
          fi
          if [ -f "packages/smooth-api-py/pyproject.toml" ]; then
            pytest packages/smooth-api-py/tests/ -v
          fi
          EOF
          chmod +x run_tests.sh

      - name: Run coding agent (Aider)
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -n "$GEMINI_API_KEY" ]; then
            MODEL="gemini/gemini-2.5-flash"
            echo "Selected Gemini model: $MODEL (1M context, 1M TPM free tier)"
          elif [ -n "$GROQ_API_KEY" ]; then
            echo "Querying available Groq models..."
            MODELS=$(curl -sS https://api.groq.com/openai/v1/models -H "Authorization: Bearer $GROQ_API_KEY" | jq -r '.data[].id' 2>/dev/null || echo "")
            echo "Detected Groq models:"
            echo "$MODELS"

            CHOSEN=""
            for candidate in "qwen/qwen3.8-27b" "deepseek-r1-distill-llama-70b" "openai/gpt-oss-20b" "openai/gpt-oss-120b"; do
              if echo "$MODELS" | grep -qx "$candidate"; then
                CHOSEN="$candidate"
                break
              fi
            done

            if [ -z "$CHOSEN" ]; then
              CHOSEN=$(echo "$MODELS" | grep -vE 'whisper|vision|guard|120b' | head -n 1)
            fi

            if [ -n "$CHOSEN" ]; then
              MODEL="groq/$CHOSEN"
            else
              MODEL="groq/qwen/qwen3.8-27b"
            fi
          else
            echo "Error: Neither GEMINI_API_KEY nor GROQ_API_KEY secret is configured."
            exit 1
          fi
          echo "Starting Aider with model: $MODEL"

          for i in 1 2 3; do
            echo "--- Coding agent attempt $i ---"
            aider --model "$MODEL" \
              --yes-always \
              --message-file task.txt \
              --auto-test \
              --map-tokens 512 \
              --no-analytics \
              --test-cmd "./run_tests.sh" && break
            echo "Attempt $i failed, retrying in 20s..."
            sleep 20
          done

      - name: Verify tests pass and commits exist
        run: |
          # Ensure new commits were made
          test "$(git rev-list --count origin/main..HEAD)" -gt 0
          echo "Agent commits verified."

      - name: Push branch and open Pull Request
        id: pr
        run: |
          git push --force origin "fix/issue-$ISSUE"
          TITLE=$(jq -r .title issue.json)
          URL=$(gh pr view "fix/issue-$ISSUE" --json url -q .url 2>/dev/null || \
            gh pr create --base main --head "fix/issue-$ISSUE" \
              --title "Fix #$ISSUE: $TITLE" \
              --body "Closes #$ISSUE.\n\nOpened automatically by **VoiceBugBot**.\nTests passed in autonomous verification run.\n\n> A human maintainer must review before merging.")
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "PR created: $URL"

      - name: Callback to n8n webhook
        if: always()
        run: |
          if [ -n "$N8N_URL" ]; then
            jq -n --arg issue "$ISSUE" --arg status "${{ job.status }}" \
              --arg pr "${{ steps.pr.outputs.url }}" \
              --arg run "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
              '{issue_number: ($issue|tonumber), status: $status, pr_url: $pr, run_url: $run}' \
            | curl -sS -X POST "$N8N_URL" \
              -H 'Content-Type: application/json' \
              -H "x-bugbot-secret: $N8N_SECRET" \
              -d @- || echo "Warning: Callback to n8n failed or was unreachable."
          else
            echo "N8N_CALLBACK_URL secret not configured, skipping callback."
          fi
