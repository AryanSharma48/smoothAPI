name: bugbot-fix
run-name: Fix issue #${{ inputs.issue_number }}

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Issue number to autonomously fix'
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: bugbot-fix-${{ inputs.issue_number }}
  cancel-in-progress: false

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      ISSUE: ${{ inputs.issue_number }}
      N8N_URL: ${{ secrets.N8N_CALLBACK_URL }}
      N8N_SECRET: ${{ secrets.N8N_SHARED_SECRET }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Read issue details
        run: |
          gh issue view "$ISSUE" --json title,body > issue.json
          echo "Fetched issue details for #$ISSUE"

      - name: Create fix branch
        run: |
          git config user.name "bugbot[bot]"
          git config user.email "bugbot@users.noreply.github.com"
          git checkout -B "fix/issue-$ISSUE"

      - name: Install dependencies & mock sandbox server
        run: |
          python -m pip install --upgrade pip
          python -m pip install aider-chat pytest pytest-asyncio requests httpx
          if [ -f "packages/smooth-api-py/pyproject.toml" ]; then
            python -m pip install -e "packages/smooth-api-py[dev]"
          fi
          if [ -f "packages/smooth-api-ts/package.json" ]; then
            npm install --prefix packages/smooth-api-ts
          fi

          # Start mock sandbox server on port 3001 required by both test suites
          if [ -f "sandbox/package.json" ]; then
            npm install --prefix sandbox
            node sandbox/server.js &
            for i in {1..10}; do
              curl -s -f http://localhost:3001/health > /dev/null && echo "Mock sandbox server ready" && break || sleep 1
            done
          fi

          # Create monorepo composite test runner
          cat << 'EOF' > run_tests.sh
          #!/bin/bash
          set -e
          if [ -f "packages/smooth-api-ts/package.json" ]; then
            npm test --prefix packages/smooth-api-ts
          fi
          if [ -f "packages/smooth-api-py/pyproject.toml" ]; then
            pytest packages/smooth-api-py/tests/ -v
          fi
          EOF
          chmod +x run_tests.sh

      # =====================================================================
      # AGENT 1: INVESTIGATOR (Root Cause Localization & Codebase Mapping)
      # =====================================================================
      - name: "Agent 1: Investigator (Localization)"
        id: investigator
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          echo "=== 🔍 Specialist 1: Investigator Agent running ==="
          python3 - << 'EOF'
          import os, json, subprocess, urllib.request

          with open("issue.json", "r") as f:
              iss = json.load(f)
              issue_title = iss.get("title", "")
              issue_body = iss.get("body", "")

          git_log = subprocess.getoutput("git log -n 5 --oneline")
          repo_files = subprocess.getoutput("git ls-files 'packages/**/*.py' 'packages/**/*.ts'")
          gemini_key = os.environ.get("GEMINI_API_KEY", "")

          prompt = f"""You are the Investigator Agent in an autonomous engineering swarm.
          Analyze this bug report for the smoothapi monorepo and localize the root cause.

          Monorepo Files:
          {repo_files[:2000]}

          Recent Subsystem Commits:
          {git_log}

          Issue: {issue_title}
          Body:
          {issue_body[:1500]}

          Respond strictly with valid JSON with keys:
          - "suspect_files": list of file paths that need inspection/fixing
          - "subsystem": "python" or "typescript"
          - "root_cause": concise 1-2 sentence technical reason
          - "fix_recommendation": concise instructions for the Coder agent
          """

          suspect_files = []
          subsystem = "python" if any(k in (issue_title + " " + issue_body).lower() for k in ["py", "python", "pytest"]) else "typescript"
          root_cause = "Subsystem bug identified from issue description."
          fix_rec = "Make the minimal surgical change to pass unit tests."

          if gemini_key:
              try:
                  url = f"https://generativelanguage.googleapis.com/v1beta/models/gemini-flash-latest:generateContent?key={gemini_key}"
                  data = json.dumps({"contents": [{"parts": [{"text": prompt}]}]}).encode('utf-8')
                  req = urllib.request.Request(url, data=data, headers={"Content-Type": "application/json"})
                  with urllib.request.urlopen(req, timeout=12) as resp:
                      res_json = json.loads(resp.read().decode('utf-8'))
                      text = res_json['candidates'][0]['content']['parts'][0]['text']
                      if "```" in text:
                          text = text.split("```")[1]
                          if text.startswith("json"):
                              text = text[4:]
                      data = json.loads(text.strip())
                      suspect_files = data.get("suspect_files", [])
                      subsystem = data.get("subsystem", subsystem)
                      root_cause = data.get("root_cause", root_cause)
                      fix_rec = data.get("fix_recommendation", fix_rec)
              except Exception as e:
                  print(f"Investigator notice: {e}")

          if not suspect_files:
              if subsystem == "python":
                  suspect_files = ["packages/smooth-api-py/smooth_api/utils.py", "packages/smooth-api-py/smooth_api/config.py"]
              else:
                  suspect_files = ["packages/smooth-api-ts/src/index.ts", "packages/smooth-api-ts/src/utils/backoff.ts"]

          with open("investigation_report.md", "w") as f:
              f.write(f"### 🔍 Investigator Report\n- **Subsystem**: {subsystem}\n- **Root Cause**: {root_cause}\n- **Recommendation**: {fix_rec}\n- **Target Files**: {', '.join(suspect_files)}\n")

          with open("target_files.txt", "w") as f:
              f.write(" ".join(suspect_files))

          with open("subsystem.txt", "w") as f:
              f.write(subsystem)

          with open("root_cause.txt", "w") as f:
              f.write(root_cause)

          print("Investigator completed. Target files:", suspect_files)
          EOF
          cat investigation_report.md

      # =====================================================================
      # AGENT 2: REPRODUCER (Test-Driven Development Red Test Generator)
      # =====================================================================
      - name: "Agent 2: Reproducer (TDD Test Generator)"
        id: reproducer
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          echo "=== 🧪 Specialist 2: Reproducer Agent running ==="
          python3 - << 'EOF'
          import os, json, urllib.request

          with open("issue.json", "r") as f:
              iss = json.load(f)
              title = iss.get("title", "")
              body = iss.get("body", "")

          with open("subsystem.txt", "r") as f:
              subsystem = f.read().strip()

          with open("root_cause.txt", "r") as f:
              root_cause = f.read().strip()

          issue_num = os.environ.get("ISSUE", "0")
          gemini_key = os.environ.get("GEMINI_API_KEY", "")

          test_code = ""
          test_path = ""

          if subsystem == "python":
              test_path = f"packages/smooth-api-py/tests/test_issue_{issue_num}_reproduce.py"
              prompt = f"""Write a minimal pytest reproduction test for this bug in packages/smooth-api-py.
              Issue #{issue_num}: {title}
              Root Cause: {root_cause}
              Description: {body[:1000]}

              The test must import from smooth_api and assert the expected correct behavior.
              Output ONLY Python code. No markdown fences.
              """
          else:
              test_path = f"packages/smooth-api-ts/tests/issue_{issue_num}_reproduce.test.ts"
              prompt = f"""Write a minimal Jest/Vitest reproduction test for this bug in packages/smooth-api-ts.
              Issue #{issue_num}: {title}
              Root Cause: {root_cause}
              Description: {body[:1000]}

              Output ONLY TypeScript code. No markdown fences.
              """

          if gemini_key:
              try:
                  url = f"https://generativelanguage.googleapis.com/v1beta/models/gemini-flash-latest:generateContent?key={gemini_key}"
                  data = json.dumps({"contents": [{"parts": [{"text": prompt}]}]}).encode('utf-8')
                  req = urllib.request.Request(url, data=data, headers={"Content-Type": "application/json"})
                  with urllib.request.urlopen(req, timeout=12) as resp:
                      res_json = json.loads(resp.read().decode('utf-8'))
                      raw = res_json['candidates'][0]['content']['parts'][0]['text']
                      if "```" in raw:
                          lines = raw.split("```")[1].split("\n")
                          if lines and lines[0] in ("python", "typescript", "ts", "py"):
                              lines = lines[1:]
                          raw = "\n".join(lines)
                      test_code = raw.strip()
              except Exception as e:
                  print(f"Reproducer notice: {e}")

          if not test_code:
              print("No valid reproduction test generated by LLM; will rely on monorepo test suite.")
              test_path = ""
          else:
              with open(test_path, "w") as f:
                  f.write(test_code)
              print(f"Reproducer generated test at {test_path}")

          with open("repro_test.txt", "w") as f:
              f.write(test_path)
          EOF
          REPRO_FILE=$(cat repro_test.txt)
          git add "$REPRO_FILE" || true
          echo "repro_file=$REPRO_FILE" >> "$GITHUB_OUTPUT"

      # =====================================================================
      # AGENT 3: CODER (Surgical TDD Fix via Aider)
      # =====================================================================
      - name: "Agent 3: Coder (Surgical TDD Fix)"
        id: coder
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          echo "=== 🛠️ Specialist 3: Coder Agent running ==="
          TARGETS=$(cat target_files.txt)
          REPRO_TEST=$(cat repro_test.txt)
          ROOT_CAUSE=$(cat root_cause.txt)
          TITLE=$(jq -r .title issue.json)

          python3 - << 'EOF'
          import json, os
          with open("issue.json", "r") as f:
              iss = json.load(f)
          title = iss.get("title", "")
          body = iss.get("body", "")
          issue_num = os.environ.get("ISSUE", "")

          targets = ""
          try:
              with open("target_files.txt", "r") as f:
                  targets = f.read().strip()
          except Exception: pass

          repro = ""
          try:
              with open("repro_test.txt", "r") as f:
                  repro = f.read().strip()
          except Exception: pass

          root_cause = ""
          try:
              with open("root_cause.txt", "r") as f:
                  root_cause = f.read().strip()
          except Exception: pass

          task_content = (
              f"You are the Coder Agent in an autonomous engineering team.\n"
              f"Your task is to FULLY IMPLEMENT the bug fix or feature requested in Issue #{issue_num}: {title}.\n\n"
              f"## COMPLETE ISSUE REQUIREMENTS & SPECIFICATION:\n"
              f"{body}\n\n"
              f"## INVESTIGATOR DIAGNOSIS:\n"
              f"{root_cause}\n\n"
              f"## TARGET FILES TO MODIFY:\n"
              f"{targets}\n\n"
              f"## REPRODUCTION TEST:\n"
              f"{repro if repro else 'None (verify with full monorepo test runner)'}\n\n"
              f"## CRITICAL INSTRUCTIONS:\n"
              f"1. You MUST modify the actual source code in {targets} to implement the requested feature or fix all issues described.\n"
              f"2. Do NOT just commit tests or .gitignore. You MUST make the functional code changes in {targets}.\n"
              f"3. Run tests with `./run_tests.sh` and make sure all tests pass.\n"
              f"4. Output concise search/replace diff blocks.\n"
          )
          with open("task.txt", "w") as f:
              f.write(task_content)
          print("Generated comprehensive task.txt for Coder Agent.")
          EOF

          # Determine primary and fallback models
          CHOSEN_GROQ="llama-3.3-70b-versatile"
          if [ -n "$GROQ_API_KEY" ]; then
            MODELS=$(curl -sS https://api.groq.com/openai/v1/models -H "Authorization: Bearer $GROQ_API_KEY" | jq -r '.data[].id' 2>/dev/null || echo "")
            for candidate in "llama-3.3-70b-versatile" "qwen-2.5-32b" "deepseek-r1-distill-llama-70b" "llama-3.1-70b-versatile"; do
              if echo "$MODELS" | grep -qx "$candidate"; then
                CHOSEN_GROQ="$candidate"
                break
              fi
            done
          fi

          if [ -n "$GEMINI_API_KEY" ]; then
            MODEL="gemini/gemini-flash-latest"
            echo "Selected primary model: $MODEL (1M context, 64k output, 1,500 RPD free tier)"
          elif [ -n "$GROQ_API_KEY" ]; then
            MODEL="groq/$CHOSEN_GROQ"
            echo "Selected Groq model: $MODEL"
          else
            echo "Error: Neither GEMINI_API_KEY nor GROQ_API_KEY secret configured."
            exit 1
          fi

          echo "Coder Agent targeting: $TARGETS and $REPRO_TEST"
          CURRENT_MODEL="$MODEL"
          for i in 1 2 3; do
            echo "--- Coding agent attempt $i (Model: $CURRENT_MODEL) ---"
            aider --model "$CURRENT_MODEL" \
              --yes-always \
              --message-file task.txt \
              --auto-test \
              --map-tokens 512 \
              --no-analytics \
              --test-cmd "./run_tests.sh" \
              $TARGETS $REPRO_TEST && break

            # If attempt 1 failed with Gemini and Groq is configured, switch to Groq on attempt 2!
            if [ "$i" -eq 1 ] && [ -n "$GROQ_API_KEY" ] && [[ "$CURRENT_MODEL" == gemini* ]]; then
              echo "Gemini attempt failed or hit rate limits. Falling back to Groq ($CHOSEN_GROQ) for attempt 2..."
              CURRENT_MODEL="groq/$CHOSEN_GROQ"
            fi

            echo "Attempt $i failed, retrying in 15s..."
            sleep 15
          done

      # =====================================================================
      # AGENT 4: QA REVIEWER (Full Regression Audit, PR Synthesis & Labels)
      # =====================================================================
      - name: "Agent 4: QA Reviewer (Audit & Pull Request)"
        id: pr
        run: |
          echo "=== 🛡️ Specialist 4: QA Reviewer Agent running ==="
          ./run_tests.sh
          echo "Monorepo test runner passed 100%!"

          # Ensure real source code changes were made (not just .gitignore or tests!)
          TOUCHED_SRC=$(git diff --name-only origin/main..HEAD | grep -v '^\.gitignore' | grep -v 'tests/' || true)
          if [ -z "$TOUCHED_SRC" ]; then
            echo "❌ Error: Coder Agent failed to modify any actual source code files!"
            echo "Files touched: $(git diff --name-only origin/main..HEAD)"
            echo "Aborting PR creation because no actual fix was implemented."
            exit 1
          fi

          git push --force origin "fix/issue-$ISSUE"
          TITLE=$(jq -r .title issue.json)

          # 1. Determine Semantic Labels based on touched files
          TOUCHED_FILES=$(git diff --name-only origin/main..HEAD)
          PR_LABELS="needs-review,swarm-verified"
          if echo "$TOUCHED_FILES" | grep -q 'packages/smooth-api-py'; then
            PR_LABELS="$PR_LABELS,scope:python"
          fi
          if echo "$TOUCHED_FILES" | grep -q 'packages/smooth-api-ts'; then
            PR_LABELS="$PR_LABELS,scope:typescript"
          fi
          if echo "$TOUCHED_FILES" | grep -q 'tests/'; then
            PR_LABELS="$PR_LABELS,type:test"
          fi
          if echo "$TOUCHED_FILES" | grep -q '\.md$'; then
            PR_LABELS="$PR_LABELS,type:documentation"
          fi

          # 2. Synthesize Multi-Agent PR Review
          export DIFF_STAT=$(git diff --stat origin/main..HEAD)
          export DIFF_SHORT=$(git diff origin/main..HEAD | head -n 100)
          export TITLE
          export ISSUE

          python3 - << 'EOF' > pr_description.md
          import os, json, urllib.request

          issue_title = os.environ.get("TITLE", "")
          issue_num = os.environ.get("ISSUE", "")
          diff_stat = os.environ.get("DIFF_STAT", "")
          diff_short = os.environ.get("DIFF_SHORT", "")
          gemini_key = os.environ.get("GEMINI_API_KEY", "")

          root_cause = "Identified root cause in subsystem."
          try:
              with open("root_cause.txt", "r") as f:
                  root_cause = f.read().strip()
          except Exception:
              pass

          repro_test = "Autonomous reproduction test"
          try:
              with open("repro_test.txt", "r") as f:
                  repro_test = f.read().strip()
          except Exception:
              pass

          prompt = f"""You are VoiceBugBot's QA Reviewer Agent.
          Write a clean, professional Pull Request description in markdown.

          Issue #{issue_num}: {issue_title}
          Investigator Root Cause: {root_cause}
          Reproducer Test: {repro_test}
          Files changed:
          {diff_stat}

          Diff sample:
          {diff_short}

          Structure your response with these exact sections:
          ## 🎯 Summary of Changes
          (Clear bullet points of what was changed and why)

          ## 🐝 Swarm Verification Lifecycle
          - 🔍 **Investigator Agent**: Pinpointed root cause: {root_cause}
          - 🧪 **Reproducer Agent**: Added TDD test `{repro_test}`
          - 🛠️ **Coder Agent**: Applied surgical fix via Gemini 2.5 Flash
          - 🛡️ **QA Reviewer Agent**: Verified 100% monorepo pass in `./run_tests.sh`

          ## 🔍 Technical Root Cause & Solution
          (Concise technical explanation)

          ## 🧪 Test Verification
          (Confirm all monorepo unit tests passed)

          ---
          > 🤖 **Autonomous Multi-Agent Swarm**: Delivered by **VoiceBugBot**. Please review before merging.
          """

          generated_body = ""
          if gemini_key:
              try:
                  url = f"https://generativelanguage.googleapis.com/v1beta/models/gemini-flash-latest:generateContent?key={gemini_key}"
                  data = json.dumps({"contents": [{"parts": [{"text": prompt}]}]}).encode('utf-8')
                  req = urllib.request.Request(url, data=data, headers={"Content-Type": "application/json"})
                  with urllib.request.urlopen(req, timeout=10) as resp:
                      res_json = json.loads(resp.read().decode('utf-8'))
                      generated_body = res_json['candidates'][0]['content']['parts'][0]['text']
              except Exception as e:
                  print(f"QA Reviewer description fallback: {e}")

          if not generated_body:
              generated_body = f"""## 🎯 Summary of Changes\n- Autonomous fix for #{issue_num}: {issue_title}\n\n## 🐝 Swarm Verification Lifecycle\n- 🔍 **Investigator Agent**: Identified root cause: {root_cause}\n- 🧪 **Reproducer Agent**: Added TDD test `{repro_test}`\n- 🛠️ **Coder Agent**: Applied surgical fix\n- 🛡️ **QA Reviewer Agent**: Monorepo tests verified\n\n## 🧪 Test Verification\n- All monorepo test suites passed in `./run_tests.sh`.\n\n---\n> 🤖 **Autonomous Multi-Agent Swarm**: Delivered by **VoiceBugBot**."""

          final_pr = f"Closes #{issue_num}.\n\n" + generated_body
          with open("pr_description.md", "w") as f:
              f.write(final_pr)
          EOF

          # 3. Create or View Pull Request
          URL=$(gh pr view "fix/issue-$ISSUE" --json url -q .url 2>/dev/null || \
            gh pr create --base main --head "fix/issue-$ISSUE" \
              --title "Fix #$ISSUE: $TITLE" \
              --body-file pr_description.md)

          # 4. Attach Labels safely (auto-creating labels in repo if missing)
          for lbl in $(echo "$PR_LABELS" | tr ',' ' '); do
            gh label create "$lbl" 2>/dev/null || true
            gh pr edit "fix/issue-$ISSUE" --add-label "$lbl" 2>/dev/null || true
          done

          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "PR created: $URL"

      - name: Callback to n8n webhook
        if: always()
        run: |
          if [ -n "$N8N_URL" ]; then
            jq -n --arg issue "$ISSUE" --arg status "${{ job.status }}" \
              --arg pr "${{ steps.pr.outputs.url }}" \
              --arg run "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
              '{issue_number: ($issue|tonumber), status: $status, pr_url: $pr, run_url: $run}' \
            | curl -sS -X POST "$N8N_URL" \
              -H 'Content-Type: application/json' \
              -H "x-bugbot-secret: $N8N_SECRET" \
              -d @- || echo "Warning: Callback to n8n failed or was unreachable."
          else
            echo "N8N_CALLBACK_URL secret not configured, skipping callback."
          fi
